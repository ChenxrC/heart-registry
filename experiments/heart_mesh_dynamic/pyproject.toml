[project]
name = "heart-mesh-dynamic-experiment"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "numpy>=1.26,<2", "scipy>=1.13,<2", "pydicom==3.0.1",
  "SimpleITK==2.5.4", "Pillow>=10,<13", "trimesh>=4.11,<5",
  "scikit-image>=0.25,<1", "pyvista>=0.47,<0.49",
  "pytest>=8.3,<9",
  "setuptools>=70", "ninja>=1.11", "iopath>=0.1.10",
]

[project.optional-dependencies]
render = ["pytorch3d"]
cpu = ["torch==2.4.1", "torchvision==0.19.1"]
cuda121 = ["torch==2.4.1", "torchvision==0.19.1"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda121" }]]

[tool.uv.sources]
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", rev = "75ebeeaea0908c5527e7b1e305fbc7681382db47" }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu121", extra = "cuda121" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu121", extra = "cuda121" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# Verified against this pinned revision's setup.py (install_requires=["iopath"]).
# Avoid importing torch merely to resolve metadata; compile only after bootstrap.
[[tool.uv.dependency-metadata]]
name = "pytorch3d"
version = "0.7.8"
requires-dist = ["iopath"]
