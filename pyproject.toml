[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ctdr-pipeline"
version = "0.1.0"
description = "Auditable PPTX-to-CT/DR registration pipeline"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "diffdrr",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pandas>=2.2,<3",
  "Pillow>=10,<13",
  "pydantic>=2.10,<3",
  "pydicom==3.0.1",
  "python-pptx>=1.0,<2",
  "PyYAML>=6,<7",
  "scipy>=1.13,<2",
  "scikit-image>=0.25,<1",
  "SimpleITK==2.5.4",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "trimesh>=4.11,<5",
  "typer>=0.15,<1",
  "pyvista>=0.47,<0.49",
  "XlsxWriter>=3.2,<4",
]

[project.optional-dependencies]
cpu = ["torch==2.5.1", "torchvision==0.20.1"]
cuda121 = ["torch==2.5.1", "torchvision==0.20.1"]
segmentation = ["totalsegmentator==2.17.0"]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7"]

[project.scripts]
ctdr = "ctdr_pipeline.cli:app"
heart-registry = "ctdr_pipeline.cli:app"
xa-audit-cine = "tools.audit_xa_cine_geometry:main"
xa-extract-cine = "tools.extract_xa_cine:main"
xa-segment-vessels = "tools.run_xa_vessel_segmentation:main"
xa-temporal-fusion = "tools.run_xa_temporal_fusion:main"
xa-calibrate-series = "tools.calibrate_xa_run_to_ct:main"
xa-build-dynamic-mesh = "tools.build_dynamic_vessel_3d:main"
xa-align-cardiac-phase = "analyze_xa_cardiac_phase:main"
ctdr-landmark-depth = "run_totalsegmentator_depth:main"

[tool.setuptools]
py-modules = ["analyze_xa_cardiac_phase", "build_ct_dr_3d_viewer", "run_totalsegmentator_depth"]

[tool.setuptools.packages.find]
include = ["ctdr_pipeline*", "heart_registry*", "tools*", "experiments*"]

[tool.setuptools.package-data]
"ctdr_pipeline.motion_validation" = ["ui/*.html", "ui/*.js"]
"experiments.heart_mesh_dynamic.probes" = ["*.html"]

[tool.setuptools.data-files]
"share/heart-registry/web/ct_dr_3d_viewer" = ["web/ct_dr_3d_viewer/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "medical: requires local hospital data",
  "slow: computationally expensive synthetic registration",
]

[tool.uv.sources]
diffdrr = { path = "third_party/DiffDRR", editable = true }
torch = [
  { index = "pytorch-cpu", marker = "extra == 'cpu'" },
  { index = "pytorch-cu121", marker = "extra != 'cpu' and extra == 'cuda121'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "extra == 'cpu'" },
  { index = "pytorch-cu121", marker = "extra != 'cpu' and extra == 'cuda121'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
